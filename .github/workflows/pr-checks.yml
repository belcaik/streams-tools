name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: (.+)$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::El título debe seguir Conventional Commits"
            exit 1
          fi

          description="${BASH_REMATCH[4]}"
          if [[ ! "$description" =~ ^[a-záéíóúüñ] ]] ||
             [[ "$description" == *. ]] ||
             (( ${#description} > 72 )); then
            echo "::error::La descripción debe iniciar en minúscula, no terminar en punto y tener como máximo 72 caracteres"
            exit 1
          fi

      - name: Check PR size
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Los lockfiles no cuentan para el límite (CONTRIBUTING.md).
          lockfiles='(^|/)(Cargo|package-lock|pnpm-lock|yarn)\.(lock|json|yaml)$'
          changed_lines=0
          page=1
          while :; do
            files=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100&page=$page")
            [[ $(jq length <<<"$files") -eq 0 ]] && break
            lines=$(jq --arg re "$lockfiles" \
              '[.[] | select(.filename | test($re) | not) | .additions + .deletions] | add // 0' <<<"$files")
            changed_lines=$((changed_lines + lines))
            page=$((page + 1))
          done
          echo "Líneas cambiadas (sin lockfiles): $changed_lines"
          if (( changed_lines > 800 )); then
            echo "::error::La PR supera el máximo de 800 líneas; divídela"
            exit 1
          fi
          if (( changed_lines > 400 )); then
            echo "::warning::La PR supera el objetivo de 400 líneas; justifícala"
          fi
