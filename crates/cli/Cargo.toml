[package]
name = "streams-tools-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "streams-tools"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_path_to_error.workspace = true
streams-tools-adapters = { path = "../adapters" }
streams-tools-core = { path = "../core" }
streams-tools-plugins = { path = "../plugins" }
streams-tools-server = { path = "../server" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true

[dev-dependencies]
sha2.workspace = true
zip.workspace = true
