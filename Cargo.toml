[workspace]
members = [
    "crates/adapters",
    "crates/core",
    "crates/server",
    "crates/cli",
    "crates/plugins",
    "examples/plugins/echo/worker",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "sink", "std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["sync"] }
toml = "1.1.8"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
zip = { version = "=0.5.13", default-features = false, features = ["deflate"] }
