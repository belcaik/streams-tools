[workspace]
members = ["crates/core", "crates/server", "crates/cli", "crates/plugins"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
tokio = { version = "1", features = ["sync"] }
toml = "1.1.8"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect"] }
